<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>会員登録（テスト用の模擬画面）</title>
<style>
  body{font:14px system-ui,sans-serif;margin:24px;max-width:760px}
  .row{display:grid;grid-template-columns:190px 1fr;gap:10px;align-items:center;margin:7px 0}
  input,select,textarea{font:inherit;padding:4px}
  h2{font-size:15px;margin:22px 0 6px;border-bottom:1px solid #ddd}
</style>
</head>
<body>
<h1>会員登録</h1>
<form onsubmit="event.preventDefault(); window.__submitCount++;">
  <h2>お名前</h2>
  <div class="row"><label for="sei">姓</label><input id="sei" name="name_sei"></div>
  <div class="row"><label for="mei">名</label><input id="mei" name="name_mei"></div>
  <div class="row"><label for="ksei">フリガナ（セイ）</label><input id="ksei" name="kana_sei"></div>
  <div class="row"><label for="kmei">フリガナ（メイ）</label><input id="kmei" name="kana_mei"></div>

  <h2>連絡先</h2>
  <div class="row"><label for="mail">メールアドレス</label><input id="mail" type="email" name="mail"></div>
  <div class="row"><label for="mail2">メールアドレス（確認用）</label><input id="mail2" type="email" name="mail_confirm"></div>
  <!-- 電話は3分割。ラベルは先頭だけ -->
  <div class="row"><span>電話番号</span><span>
    <input name="tel1" maxlength="4" size="4"> <span>－</span>
    <input name="tel2" maxlength="4" size="4"> <span>－</span>
    <input name="tel3" maxlength="4" size="4"></span></div>
  <!-- ラベルからは判断しにくい欄（Jev の出番） -->
  <div class="row"><label for="day">日中つながるご連絡先</label><input id="day" name="contact_daytime" type="tel"></div>

  <h2>ご住所</h2>
  <!-- 郵便番号は 3桁＋4桁 -->
  <div class="row"><span>郵便番号</span><span>〒
    <input name="zip1" maxlength="3" size="3"> <span>－</span>
    <input name="zip2" maxlength="4" size="4"></span></div>
  <div class="row"><label for="pref">都道府県</label><select id="pref" name="pref"><option value="">選択してください</option></select></div>
  <div class="row"><label for="city">市区町村</label><input id="city" name="addr_city"></div>
  <div class="row"><label for="st">番地</label><input id="st" name="addr_street"></div>
  <div class="row"><label for="bld">建物名・部屋番号</label><input id="bld" name="addr_building"></div>

  <h2>その他</h2>
  <!-- 生年月日は年・月・日の3つのプルダウン -->
  <div class="row"><span>生年月日</span><span>
    <select name="birth_y"></select> <span>年</span>
    <select name="birth_m"></select> <span>月</span>
    <select name="birth_d"></select> <span>日</span></span></div>
  <div class="row"><label for="work">お勤め先</label><input id="work" name="workplace"></div>
  <div class="row"><label for="dept">部署</label><input id="dept" name="dept"></div>
  <!-- 個人情報ではないので空のままが正しい -->
  <div class="row"><label for="station">ご自宅の最寄り駅</label><input id="station" name="station"></div>
  <div class="row"><label for="req">ご要望</label><textarea id="req" name="request"></textarea></div>

  <h2>触ってはいけない欄</h2>
  <div class="row"><label for="pw">パスワード</label><input id="pw" type="password" name="password"></div>
  <div class="row"><label for="card">カード番号</label><input id="card" name="cardnumber" autocomplete="cc-number"></div>

  <button type="submit">登録する</button>
</form>
<script>
  window.__submitCount = 0;
  const pref = document.getElementById('pref');
  '北海道,青森県,岩手県,宮城県,秋田県,山形県,福島県,茨城県,栃木県,群馬県,埼玉県,千葉県,東京都,神奈川県,新潟県,富山県,石川県,福井県,山梨県,長野県,岐阜県,静岡県,愛知県,三重県,滋賀県,京都府,大阪府,兵庫県,奈良県,和歌山県,鳥取県,島根県,岡山県,広島県,山口県,徳島県,香川県,愛媛県,高知県,福岡県,佐賀県,長崎県,熊本県,大分県,宮崎県,鹿児島県,沖縄県'
    .split(',').forEach((p, i) => pref.add(new Option(p, String(i + 1).padStart(2, '0'))));
  const fill = (name, from, to, fmt) => {
    const s = document.querySelector(`[name=${name}]`);
    s.add(new Option('--', ''));
    for (let i = from; i <= to; i++) s.add(new Option(fmt(i), String(i).padStart(2, '0')));
  };
  fill('birth_y', 1940, 2010, (i) => String(i));
  fill('birth_m', 1, 12, (i) => `${i}`);
  fill('birth_d', 1, 31, (i) => `${i}`);
</script>
</body>
</html>
